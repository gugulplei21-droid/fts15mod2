name: Build mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar NDK estable
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Compilar Dobby (probando versiones)
        run: |
          NDK=${{ steps.ndk.outputs.ndk-path }}
          git clone https://github.com/jmpews/Dobby.git DobbySrc
          OK=0
          for D in 2022-12-31 2022-06-30 2023-06-30 2021-12-31; do
            echo "##### Probando Dobby de $D #####"
            rm -rf Dobby
            cp -r DobbySrc Dobby
            COMMIT=$(git -C Dobby rev-list -n 1 --before="$D" HEAD)
            if [ -z "$COMMIT" ]; then echo "Sin commit para $D"; continue; fi
            git -C Dobby checkout -q -f "$COMMIT"
            git -C Dobby log -1 --format="Version: %h  fecha: %cd"

            # Cambiar sintaxis de Apple (@PAGE) por la de Android
            for f in $(find Dobby/source -name "*.asm"); do
              sed -i -E 's/([A-Za-z0-9_()]+)@PAGEOFF/:lo12:\1/g; s/([A-Za-z0-9_()]+)@PAGE/\1/g' "$f"
            done

            if cmake -S Dobby -B Dobby/build \
                 -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
                 -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
                 -DCMAKE_BUILD_TYPE=Release -DDOBBY_GENERATE_SHARED=OFF \
              && { cmake --build Dobby/build --target dobby_static -j4 \
                   || cmake --build Dobby/build -j4; }; then
              OK=1
              echo "##### FUNCIONO con la fecha $D #####"
              break
            fi
            echo "##### Fallo con $D, probando la siguiente #####"
          done
          if [ "$OK" != "1" ]; then
            echo "Ninguna version de Dobby compilo"
            exit 1
          fi
          find Dobby/build -name "*.a"

      - name: Compilar mi libreria
        run: |
          echo "=== Archivos en el repositorio ==="
          ls -la
          SRC=$(find . -iname "modmenu.cpp" -not -path "./Dobby*" -not -path "./DobbySrc*" | head -n1)
          if [ -z "$SRC" ]; then
            echo "ERROR: no existe modmenu.cpp en el repositorio"
            exit 1
          fi
          DIR=$(dirname "$SRC")
          echo "Usando: $SRC"
          cp Dobby/include/dobby.h "$DIR/"
          LIBS=$(find Dobby/build -name "*.a" | tr '\n' ' ')
          CXX=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          $CXX -shared -fPIC -std=c++17 -O2 -fvisibility=hidden -static-libstdc++ \
            -I"$DIR" "$SRC" -Wl,--start-group $LIBS -Wl,--end-group -llog -ldl -o libmodmenu.so
          ls -l libmodmenu.so

      - name: Bajar el APK original
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir in
          gh release download apk-original --repo ${{ github.repository }} --pattern "*.apk" --dir in
          mv in/*.apk original.apk

      - name: Preparar apktool
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar

      - name: Meter el mod dentro del APK
        run: |
          java -jar apktool.jar d original.apk -o out -f
          mkdir -p out/lib/arm64-v8a
          cp libmodmenu.so out/lib/arm64-v8a/
          python3 inject.py

      - name: Reconstruir y firmar
        run: |
          java -jar apktool.jar b out -o unsigned.apk
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)
          $BT/zipalign -p -f 4 unsigned.apk aligned.apk
          keytool -genkeypair -keystore mod.keystore -alias mod -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass modpass123 -keypass modpass123 -dname "CN=Mod"
          $BT/apksigner sign --ks mod.keystore --ks-pass pass:modpass123 \
            --out FTS_mod.apk aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: APK-modificado
          path: FTS_mod.apk
