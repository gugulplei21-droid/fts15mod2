name: Build mod

on:
  workflow_dispatch:   # permite pulsar un boton para empezar

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar Dobby
        run: |
          git clone --depth 1 https://github.com/jmpews/Dobby.git
          cmake -S Dobby -B Dobby/build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release -DDOBBY_GENERATE_SHARED=OFF
          cmake --build Dobby/build -j4
          find Dobby/build -name "libdobby.a"

      - name: Compilar mi libreria
        run: |
          cp Dobby/include/dobby.h .
          LIBDOBBY=$(find Dobby/build -name libdobby.a | head -n1)
          CXX=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          $CXX -shared -fPIC -std=c++17 -O2 -fvisibility=hidden -static-libstdc++ \
            modmenu.cpp $LIBDOBBY -llog -ldl -o libmodmenu.so
          ls -l libmodmenu.so

      - name: Bajar el APK original
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir in
          gh release download apk-original --repo ${{ github.repository }} --pattern "*.apk" --dir in
          mv in/*.apk original.apk

      - name: Preparar apktool
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar

      - name: Meter el mod dentro del APK
        run: |
          java -jar apktool.jar d original.apk -o out -f
          mkdir -p out/lib/arm64-v8a
          cp libmodmenu.so out/lib/arm64-v8a/
          python3 inject.py

      - name: Reconstruir y firmar
        run: |
          java -jar apktool.jar b out -o unsigned.apk
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)
          $BT/zipalign -p -f 4 unsigned.apk aligned.apk
          keytool -genkeypair -keystore mod.keystore -alias mod -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass modpass123 -keypass modpass123 -dname "CN=Mod"
          $BT/apksigner sign --ks mod.keystore --ks-pass pass:modpass123 \
            --out FTS_mod.apk aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: APK-modificado
          path: FTS_mod.apk
